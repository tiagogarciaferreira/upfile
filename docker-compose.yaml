services:
  app:
    container_name: app
    image: tiagogarciaferreira/upfile:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - local
    env_file:
      - ./.env.local
    environment:
      POSTGRES_HOST: postgres
      SSL_KEY_STORE: file:/run/secrets/upfile_tls_keystore
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public_key
      JWT_PRIVATE_KEY: file:/run/secrets/jwt_private_key
      SPRING_SQL_INIT_DATA_LOCATIONS: file:/app/db/data/seed_tb_users.sql,file:/app/db/data/seed_tb_countries.sql
      SPRING_FLYWAY_LOCATIONS: filesystem:/app/db/migration
      LOG_CONFIG_PATH: file:/app/config/logback-spring.xml
      LOG_PATH: /app/logs
    ports:
      - "127.0.0.1:${SERVER_PORT:-8443}:${SERVER_PORT:-8443}"
    volumes:
      - ./src/main/resources/db/data/seed_tb_users.sql:/app/db/data/seed_tb_users.sql:ro
      - ./src/main/resources/db/data/seed_tb_countries.sql:/app/db/data/seed_tb_countries.sql:ro
      - ./src/main/resources/db/migration:/app/db/migration:ro
      - ./src/main/resources/logback-spring.xml:/app/config/logback-spring.xml:ro
      - ./logs:/app/logs:rw
    secrets:
      - upfile_tls_keystore
      - jwt_public_key
      - jwt_private_key
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/localhost/8443" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - upfile-net

  postgres:
    container_name: postgres
    image: postgres:17.1-alpine
    restart: unless-stopped
    shm_size: 64mb
    profiles:
      - local
    env_file:
      - ./.env.local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 128M
        reservations:
          cpus: "0.10"
          memory: 64M
    security_opt:
      - no-new-privileges:true
    networks:
      - upfile-net

  minio:
    container_name: minio
    image: quay.io/minio/aistor/minio:latest
    restart: unless-stopped
    profiles:
      - local
    env_file:
      - ./.env.local
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:${STORAGE_PORT:-9000}"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:${STORAGE_CONSOLE_PORT:-9001}"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ADMIN_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_ADMIN_PASSWORD}
    volumes:
      - minio_data:/mnt/data
      - ./etc/certs/storage_cert.pem:/etc/minio/certs/public.crt:ro
      - ./etc/certs/storage_key.pem:/etc/minio/certs/private.key:ro
      - ./etc/storage/minio.license:/minio.license:ro
    command: server /mnt/data --license /minio.license --certs-dir /etc/minio/certs
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    networks:
      - upfile-net

volumes:
  postgres_data:
    name: postgres_data
    driver: local
  minio_data:
    name: minio_data
    driver: local

networks:
  upfile-net:
    driver: bridge

secrets:
  upfile_tls_keystore:
    file: etc/certs/upfile-tls-keystore.p12
  jwt_public_key:
    file: etc/jwt/jwt-public-key.jwk
  jwt_private_key:
    file: etc/jwt/jwt-private-key.jwk